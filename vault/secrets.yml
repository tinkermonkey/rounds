---
# Rounds vault secrets
#
# Fill in values, then encrypt this file before committing:
#   ansible-vault encrypt vault/secrets.yml
#
# All variables prefixed with rounds_ are rendered into .env.rounds
# by templates/env.rounds.j2 during the rounds.yml playbook run.

# ============================================================================
# Deployment target
# ============================================================================
# Absolute path to the monitored project root on the target host.
# rounds will be deployed here and the directory mounted read-only as
# /workspace/target inside the container.
rounds_target_project_dir: /opt/rounds

# ============================================================================
# Run mode
# ============================================================================
rounds_run_mode: daemon

# ============================================================================
# Telemetry backend
# ============================================================================
rounds_telemetry_backend: signoz
rounds_signoz_api_url: http://localhost:3301
rounds_signoz_api_key: ""
rounds_jaeger_api_url: http://localhost:16686
rounds_grafana_loki_url: http://localhost:3100
rounds_grafana_tempo_url: http://localhost:3200
rounds_grafana_prometheus_url: http://localhost:9090
rounds_grafana_api_key: ""

# ============================================================================
# Signature store
# ============================================================================
rounds_store_backend: sqlite
rounds_store_postgresql_url: ""

# ============================================================================
# Diagnosis engine
# ============================================================================
rounds_diagnosis_backend: claude_code
# Set one of the following two authentication options:
rounds_anthropic_api_key: ""
rounds_claude_code_oauth_token: ""
rounds_claude_code_budget_usd: "5.0"
rounds_claude_model: claude-sonnet-4-6
rounds_openai_api_key: ""
rounds_daily_budget_limit: "50.0"

# ============================================================================
# Notifications
# ============================================================================
rounds_notification_backend: markdown
rounds_github_token: ""
rounds_github_repo: ""

# ============================================================================
# Service filtering
# ============================================================================
rounds_service_filter: ""
rounds_service_host_map: "{}"

# ============================================================================
# Polling
# ============================================================================
rounds_poll_interval_seconds: "60"
rounds_poll_batch_size: "100"
rounds_error_lookback_minutes: "15"

# ============================================================================
# Logging
# ============================================================================
rounds_log_level: INFO
rounds_log_format: text

# ============================================================================
# Webhook (only used when rounds_run_mode=webhook)
# ============================================================================
rounds_webhook_api_key: ""
rounds_webhook_require_auth: "false"
