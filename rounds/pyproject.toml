[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rounds"
version = "0.1.0"
description = "Autonomous diagnostic agent for OpenTelemetry data"
requires-python = ">=3.11"
authors = [
    { name = "Rounds Contributors" },
]
license = { text = "MIT" }
keywords = ["diagnostics", "observability", "opentelemetry", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
]

dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "aiosqlite>=0.19",
    "httpx>=0.25",
    "python-dotenv>=1.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
    "openai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "mypy>=1.0",
    "ruff>=0.1",
    "black>=23.0",
    "types-python-dateutil",
]

[project.urls]
Homepage = "https://github.com/tinkermonkey/rounds"
Issues = "https://github.com/tinkermonkey/rounds/issues"
Discussions = "https://github.com/tinkermonkey/rounds/discussions"

# pyproject.toml lives inside the "rounds" package's own root directory
# (alongside __init__.py/main.py/config.py/telemetry.py), not one level
# above it, so `packages.find` (which only ever discovers subdirectories of
# `where`, never `where` itself) can never surface a "rounds" package no
# matter what `include`/`where` say -- it only ever found "core"/"adapters"
# as unnamespaced top-level packages, and never packaged rounds/__init__.py,
# main.py, config.py, or telemetry.py at all. package-dir remaps "." (this
# directory) to be the source root of the "rounds" package itself; packages
# is the explicit, fully-enumerated list (root + every real subpackage,
# including adapters' nested cli/diagnosis/notification/scheduler/store/
# telemetry/webhook submodules) so everything lands correctly namespaced
# under rounds.* instead of loose top-level core/adapters.
[tool.setuptools]
package-dir = {"rounds" = "."}
packages = [
    "rounds",
    "rounds.adapters",
    "rounds.adapters.cli",
    "rounds.adapters.diagnosis",
    "rounds.adapters.notification",
    "rounds.adapters.scheduler",
    "rounds.adapters.store",
    "rounds.adapters.telemetry",
    "rounds.adapters.webhook",
    "rounds.core",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_no_return = true

[[tool.mypy.overrides]]
module = "openai"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    ".eggs",
    "*.egg",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "RUF"]
ignore = ["E501"]  # line-length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["rounds"]
